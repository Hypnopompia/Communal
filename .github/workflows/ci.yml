name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Transport spike (loopback, 256 MiB)
        run: pnpm --filter @communal/spike-transport exec tsx --conditions=@communal/source src/bench.ts local --bytes 256M

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose -f docker/compose.dev.yml build
      - name: Start dev stack
        run: docker compose -f docker/compose.dev.yml up -d --wait hub && docker compose -f docker/compose.dev.yml up -d
      - name: Hub health
        run: curl -fsSk https://localhost:8443/healthz
      - name: Transport spike between containers (1 GiB)
        run: |
          F=docker/compose.dev.yml
          docker compose -f $F exec -T node-a communal-spike peer --me alice --peer bob --role up --port 41641 --peer-addr node-b:41642 --bytes 1G &
          docker compose -f $F exec -T node-b communal-spike peer --me bob --peer alice --role down --port 41642 --peer-addr node-a:41641 --bytes 1G
          wait
      - if: always()
        run: docker compose -f docker/compose.dev.yml logs --no-color | tail -100
