name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # pnpm comes from corepack below: no package-manager cache before it exists.
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          # The full 100k-file M2 fixture runs on Linux; smaller elsewhere to keep CI quick.
          M2_FILES: ${{ matrix.os == 'ubuntu-latest' && '100000' || '10000' }}
      - name: Transport spike (loopback, 256 MiB)
        run: pnpm --filter @communal/spike-transport exec tsx --conditions=@communal/source src/bench.ts local --bytes 256M

  desktop:
    # M9: the Electron app builds, and the core starts in its utilityProcess with every native
    # piece working (better-sqlite3, udx-native, sharp, canvas, ffmpeg, trash).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # pnpm comes from corepack below: no package-manager cache before it exists.
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @communal/desktop... run build
      - name: Smoke test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node apps/desktop/scripts/smoke.mjs
      - name: Smoke test
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/smoke.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose -f docker/compose.dev.yml build
      - name: Start dev stack
        run: docker compose -f docker/compose.dev.yml up -d --wait hub && docker compose -f docker/compose.dev.yml up -d
      - name: Hub health
        run: curl -fsSk https://localhost:8443/healthz
      - name: Transport spike between containers (1 GiB)
        run: |
          F=docker/compose.dev.yml
          docker compose -f $F exec -T node-a communal-spike peer --me alice --peer bob --role up --port 41701 --peer-addr node-b:41702 --bytes 1G &
          docker compose -f $F exec -T node-b communal-spike peer --me bob --peer alice --role down --port 41702 --peer-addr node-a:41701 --bytes 1G
          wait
      - if: always()
        run: docker compose -f docker/compose.dev.yml logs --no-color | tail -100

  nat-lab:
    # HANDOFF §12 M4: transfers across NATs in a test lab (two clients behind separate NAT
    # routers; only hole punching connects them).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker/nat/test.sh
