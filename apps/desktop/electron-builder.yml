# Desktop packaging (HANDOFF §12 M9, ADR 0016). Run through `pnpm --filter @communal/desktop
# package`, which builds a flat production copy of the app first (scripts/package.mjs).
appId: app.communal.desktop
productName: Communal
copyright: Communal contributors
directories:
  output: ../release
  buildResources: build
# No asar: the core runs ffmpeg and the OS trash helper by file path and loads native modules
# and pdf.js font files from disk, none of which works from inside an archive (ADR 0016).
asar: false
# The native modules use N-API prebuilds that load in Electron as they are: nothing to rebuild.
npmRebuild: false
nodeGypRebuild: false
files:
  - package.json
  - out/**
  - resources/**
  - node_modules/**
  - '!node_modules/.pnpm/**'
  - '!node_modules/**/*.{map,md,markdown,ts,tsx}'
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}/**'
  - '!node_modules/@communal/*/src/**'
  # Sources and builds nothing loads at run time.
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/pdfjs-dist/{build,web,image_decoders,types}/**'
mac:
  category: public.app-category.utilities
  # Icon Composer document from scripts/icons.mjs, so macOS 26 can show its dark, clear and tinted
  # looks. electron-builder compiles it with actool (Xcode 26) and makes the .icns for older macOS.
  icon: build/icon.icon
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing uses the Developer ID identity in the keychain (or CSC_LINK / CSC_KEY_PASSWORD);
  # scripts/package.mjs turns notarizing on when the App Store Connect API key is set.
  # One app per CPU, named with the CPU so the updater can tell them apart (ADR 0016).
  artifactName: Communal-${version}-${arch}.${ext}
  extendInfo:
    NSLocalNetworkUsageDescription: Communal connects directly to the computers of people you share with, including ones on your own network, and asks your router to let them reach this one.
afterPack: scripts/unique-uuid.mjs
# Updates come from GitHub Releases (electron-updater reads latest*.yml from the latest
# release). scripts/release.mjs uploads the files; builds themselves never publish.
publish:
  provider: github
  owner: Hypnopompia
  repo: Communal
  releaseType: draft
dmg:
  sign: false
win:
  icon: build/icon.png
  target: [nsis]
  # Authenticode signing uses WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD when present.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
linux:
  # Needed: with none, Linux falls back to mac.icon, the macOS-only Icon Composer document, and
  # the app ships with no icon (a generic gear in the dock). A folder of sizes from icons.mjs.
  icon: build/icons
  target: [AppImage, deb]
  executableName: communal
  artifactName: communal-${version}-${arch}.${ext}
  category: Network
  maintainer: Communal contributors
  synopsis: Private file sharing between people you know
deb:
  packageName: communal
